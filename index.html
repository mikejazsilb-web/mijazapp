<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#171717">
  <title>MIJAZZ APPAREL | Login</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --blue: #0fdbff;
      --blue-hover: #48e5ff;
      --white: #ffffff;
      --muted: #eeeeee;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: clamp(14px, 3vw, 35px);
      font-family: Arial, Helvetica, sans-serif;
      color: var(--white);

      background:
        linear-gradient(
          rgba(0, 0, 0, 0.18),
          rgba(0, 0, 0, 0.30)
        ),
        url("bck.png") center / cover no-repeat fixed;
    }

    .login-container {
      width: 100%;
      max-width: 1050px;
      display: grid;
      grid-template-columns: 0.85fr 1.15fr;
      align-items: center;
      gap: clamp(28px, 5vw, 60px);
      padding: clamp(28px, 5vw, 60px);

      /* Clearer gray glass */
      background: rgba(45, 45, 45, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.30);
      border-radius: 25px;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.30);

      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .login-left {
      min-width: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* No extra outline around the logo */
    .logo-frame {
      width: min(100%, 310px);
      aspect-ratio: 1 / 1;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      border: none;
      border-radius: 50%;
      background: transparent;
      box-shadow: none;
    }

    .brand-logo {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 50%;
      background: transparent;
    }

    .login-right {
      width: 100%;
      min-width: 0;
    }

    .brand-title {
      margin-bottom: 25px;
      text-align: center;
      font-size: clamp(30px, 4vw, 49px);
      font-weight: 900;
      line-height: 1.15;
      letter-spacing: -1px;
      color: #ffffff;
      overflow-wrap: anywhere;
    }

    .brand-title span {
      color: var(--blue);
      text-shadow: 0 0 10px rgba(15, 219, 255, 0.12);
    }

    .login-heading {
      margin-bottom: 12px;
      text-align: center;
      font-size: clamp(23px, 3vw, 29px);
      font-weight: 800;
      color: #ffffff;
    }

    .login-subtitle {
      margin-bottom: 28px;
      text-align: center;
      color: #e4e4e4;
      font-size: 14px;
      line-height: 1.7;
    }

    .input-group {
      margin-bottom: 21px;
    }

    .input-group label {
      display: block;
      margin-bottom: 9px;
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
    }

    .input-group input {
      display: block;
      width: 100%;
      min-width: 0;
      min-height: 50px;
      padding: 14px 15px;

      border: 1px solid rgba(255, 255, 255, 0.36);
      border-radius: 11px;
      outline: none;
      background: rgba(235, 235, 235, 0.17);
      color: #ffffff;

      font-family: inherit;
      font-size: 15px;

      transition:
        border-color 0.2s,
        background 0.2s,
        box-shadow 0.2s;
    }

    .input-group input::placeholder {
      color: #e0e0e0;
      opacity: 1;
    }

    .input-group input:focus {
      border-color: var(--blue);
      background: rgba(235, 235, 235, 0.22);
      box-shadow: 0 0 0 3px rgba(15, 219, 255, 0.13);
    }

    .password-wrapper {
      position: relative;
    }

    .password-wrapper input {
      padding-right: 75px;
    }

    .toggle-password {
      position: absolute;
      top: 50%;
      right: 12px;
      transform: translateY(-50%);
      padding: 8px;
      border: none;
      background: transparent;
      color: var(--blue);
      font-family: inherit;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }

    .toggle-password:hover {
      color: var(--blue-hover);
    }

    .login-button {
      display: block;
      width: 100%;
      min-height: 52px;
      margin-top: 7px;
      padding: 14px;

      border: 1px solid var(--blue);
      border-radius: 11px;
      background: var(--blue);
      color: #071820;

      font-family: inherit;
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 1px;
      cursor: pointer;

      transition:
        background 0.2s,
        transform 0.2s,
        box-shadow 0.2s;
    }

    .login-button:hover {
      background: var(--blue-hover);
      border-color: var(--blue-hover);
      transform: translateY(-1px);
      box-shadow: 0 5px 16px rgba(15, 219, 255, 0.18);
    }

    button:focus-visible {
      outline: 2px solid #ffffff;
      outline-offset: 4px;
    }

    #message {
      margin-top: 17px;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .footer-text {
      margin-top: 24px;
      color: #dedede;
      text-align: center;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
    }

    @media (max-width: 700px) {
      body {
        padding: 16px;
        background-attachment: scroll;
      }

      .login-container {
        max-width: 460px;
        grid-template-columns: 1fr;
        gap: 24px;
        padding: clamp(22px, 5vw, 32px);
        border-radius: 22px;
        background: rgba(40, 40, 40, 0.82);
      }

      .login-left {
        order: 1;
      }

      .login-right {
        order: 2;
      }

      .logo-frame {
        width: clamp(130px, 36vw, 190px);
      }

      .brand-title {
        margin-bottom: 20px;
        font-size: clamp(30px, 8vw, 42px);
      }

      .login-heading {
        font-size: clamp(23px, 6vw, 28px);
      }

      .login-subtitle {
        margin-bottom: 23px;
        font-size: 13px;
      }

      .input-group {
        margin-bottom: 18px;
      }
    }

    @media (max-width: 360px) {
      body {
        padding: 10px;
      }

      .login-container {
        padding: 20px 15px;
        gap: 21px;
      }

      .brand-title {
        font-size: 27px;
      }

      .logo-frame {
        width: 125px;
      }

      .input-group input {
        font-size: 14px;
      }
    }

    @media (max-height: 500px) and (min-width: 701px) {
      body {
        align-items: flex-start;
        padding-top: 15px;
        padding-bottom: 15px;
      }

      .login-container {
        margin: auto;
        padding-top: 25px;
        padding-bottom: 25px;
      }

      .logo-frame {
        width: min(100%, 200px);
      }

      .brand-title {
        margin-bottom: 15px;
      }

      .login-subtitle {
        margin-bottom: 15px;
      }

      .input-group {
        margin-bottom: 12px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition: none !important;
      }
    }
  </style>
</head>

<body>

  <main class="login-container">

    <section class="login-left">
      <div class="logo-frame">
        <img
          src="logo.png"
          alt="MIJAZZ APPAREL Logo"
          class="brand-logo"
        >
      </div>
    </section>

    <section class="login-right">

      <h1 class="brand-title">
        MIJAZZ <span>APPAREL</span>
      </h1>

      <h2 class="login-heading">PLEASE LOG IN!</h2>

      <p class="login-subtitle">
        Welcome back! Enter your account details to continue.
      </p>

      <form id="loginForm">

        <div class="input-group">
          <label for="username">Username</label>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter username"
            autocomplete="username"
            required
          >
        </div>

        <div class="input-group">
          <label for="password">Password</label>

          <div class="password-wrapper">
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter password"
              autocomplete="current-password"
              required
            >

            <button
              type="button"
              class="toggle-password"
              id="togglePassword"
              aria-label="Show password"
            >SHOW</button>
          </div>
        </div>

        <button type="submit" class="login-button">
          LOG IN
        </button>

        <div id="message" role="status" aria-live="polite"></div>

      </form>

      <p class="footer-text">
        MIJAZZ APPAREL &copy; 2026
      </p>

    </section>

  </main>

  <script>
    const USERNAME = "admin";
    const PASSWORD = "pass123";

    const loginForm = document.getElementById("loginForm");
    const usernameInput = document.getElementById("username");
    const passwordInput = document.getElementById("password");
    const togglePassword = document.getElementById("togglePassword");
    const message = document.getElementById("message");

    togglePassword.addEventListener("click", function () {
      const showPassword = passwordInput.type === "password";

      passwordInput.type = showPassword ? "text" : "password";
      togglePassword.textContent = showPassword ? "HIDE" : "SHOW";

      togglePassword.setAttribute(
        "aria-label",
        showPassword ? "Hide password" : "Show password"
      );
    });

    loginForm.addEventListener("submit", function (event) {
      event.preventDefault();

      const username = usernameInput.value.trim();
      const password = passwordInput.value;

      if (username === USERNAME && password === PASSWORD) {
        message.style.color = "#a9ffc0";
        message.textContent = "Login successful!";

        setTimeout(function () {
          window.location.href = "home.html";
        }, 800);
      } else {
        message.style.color = "#ffb5b5";
        message.textContent = "Invalid username or password.";
      }
    });
  </script>

</body>
</html>
