<html >
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Home</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        html {
            font-size: 16px;
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            background-image: url("bck.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #101522;
            background-attachment: fixed;
            color: white;
        }

        .home {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: clamp(20px, 5vw, 50px);
            padding-bottom: clamp(120px, 16vh, 160px);
        }

        .content {
            width: 100%;
            max-width: 850px;
            padding: clamp(25px, 5vw, 55px);
            background: rgba(255, 255, 255, 0.10);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: clamp(16px, 3vw, 25px);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .content h1 {
            font-size: clamp(30px, 5vw, 55px);
            line-height: 1.2;
            margin-bottom: clamp(15px, 3vw, 25px);
            overflow-wrap: break-word;
        }

        .content h1 span {
            color: #00d9ff;
        }

        .content p {
            font-size: clamp(15px, 1.8vw, 19px);
            line-height: 1.8;
            color: white;
            margin-bottom: 0;
            overflow-wrap: break-word;
        }

        .bottom-nav {
            position: fixed;
            bottom: max(15px, env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            width: min(95%, 1000px);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: clamp(4px, 1vw, 10px);
            padding: clamp(8px, 1.5vw, 12px);
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 20px;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
            z-index: 1000;
        }

        .bottom-nav a {
            flex: 0 1 auto;
            text-align: center;
            text-decoration: none;
            color: white;
            padding: clamp(10px, 1.4vw, 13px)
                     clamp(10px, 1.8vw, 18px);
            border-radius: 12px;
            background: transparent;
            font-size: clamp(12px, 1.3vw, 15px);
            line-height: 1.3;
            white-space: nowrap;
            transition: background 0.3s ease,
                        color 0.3s ease;
        }

        .bottom-nav a:hover,
        .bottom-nav a:focus-visible {
            background: #00d9ff;
            color: black;
            outline: none;
        }

        .bottom-nav .logout:hover,
        .bottom-nav .logout:focus-visible {
            background: #ff4545;
            color: white;
        }

        @media (max-width: 600px) {
            .home {
                padding: 18px;
                padding-bottom: 155px;
            }

            .content {
                padding: clamp(24px, 6vw, 35px) clamp(18px, 5vw, 25px);
            }

            .content h1 {
                font-size: clamp(28px, 7vw, 38px);
            }

            .content p {
                font-size: clamp(15px, 4vw, 17px);
                line-height: 1.7;
            }

            .bottom-nav {
                width: 96%;
                bottom: max(8px, env(safe-area-inset-bottom));
                padding: 8px;
                gap: 5px;
                border-radius: 16px;
            }

            .bottom-nav a {
                flex: 1 1 auto;
                padding: 10px 8px;
                font-size: clamp(12px, 3.2vw, 14px);
                border-radius: 9px;
            }
        }

        @media (max-width: 360px) {
            .bottom-nav {
                gap: 4px;
                padding: 6px;
            }

            .bottom-nav a {
                padding: 9px 6px;
                font-size: 12px;
            }

            .home {
                padding-bottom: 170px;
            }
        }

        @media (max-height: 500px) and (orientation: landscape) {
            .home {
                min-height: 100vh;
                padding-top: 25px;
                padding-bottom: 100px;
            }

            .content {
                padding: 25px;
            }

            .content h1 {
                font-size: clamp(27px, 5vh, 40px);
            }

            .content p {
                font-size: clamp(14px, 2.5vh, 17px);
            }

            .bottom-nav {
                position: fixed;
                bottom: 8px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            html {
                scroll-behavior: auto;
            }

            *,
            *::before,
            *::after {
                transition: none !important;
            }
        }
    </style>
</head>

<body>

    <nav class="bottom-nav" aria-label="Main navigation">
        <a href="home.html">Home</a>
        <a href="about.html">About</a>
        <a href="product.html">Product</a>
        <a href="contact.html">Contact</a>
        <a href="film.html">Film Viewing</a>
        <a href="index.html" class="logout">Logout</a>
    </nav>

    <main class="home">
        <section class="content">
            <h1>
                Welcome to <span>My Website</span>
            </h1>

            <p>
                Welcome to our website! Explore our products,
                learn more about us, contact us, and enjoy our
                available films. Everything you need is organized
                in one simple and easy-to-use website.
            </p>
        </section>
    </main>

</body>
</html>
